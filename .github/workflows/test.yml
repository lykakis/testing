# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  push: # Run on every push to any branch
    branches: [ main ] # Or specify branches like [ main, develop ]
  pull_request: # Also run on pull requests to these branches
    branches: [ main ]
  workflow_dispatch: # Allows you to run this workflow manually from the Actions tab

jobs:
  build-and-test: # You can name this job anything
    runs-on: ubuntu-latest # Specifies the type of virtual machine to run the job on

    steps:
      # Step 1: Check out the code from your repository
      - name: Checkout repository
        uses: actions/checkout@v4 # Official GitHub action to checkout code
      - name: Setup Java
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: 21
          distribution: 'graalvm'
          cache: 'maven'
      # For Quarkus, 'mvn install' or 'mvn verify' typically runs tests
      - name: Build and test with Maven
        run: mvn -B clean install
